name = "orbicurve-cores"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["OrbicurveCores"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "OrbicurveCores"

[[require]]
name = "pi1"
git = "https://github.com/lana-agents/pi1.git"
rev = "1f39d5b416ee130abe42fe92545a0af753551849"

# Uniformisation of once-punctured elliptic curves (U1): `Uniformization.uniformization_oncePunctured`.
# `oka` pins `lana-agents/heights` at 3539e2a; this is the only `heights` revision in this project.
[[require]]
name = "oka"
git = "https://github.com/lana-agents/oka.git"
rev = "84ac5cfe6482db1a4f456f8d0d89d3e809952a3e"
