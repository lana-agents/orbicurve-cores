      status: "proved"
    - source: "Takeuchi 1983, classification of arithmetic (1;∞)-groups"
      lean: "OrbicurveCores.isArithmeticSL_iff_isTakeuchiConj"
      module: "OrbicurveCores/Classification.lean"
      status: "proved"
    - source: "Mochizuki, Canonical curves, Proposition 2.7 (any field of characteristic 0)"
      lean: "OrbicurveCores.canLift27Genuine"
      module: "OrbicurveCores/Genuine/Final.lean"
      status: "proved"

