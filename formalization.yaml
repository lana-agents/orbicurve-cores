automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        orchestra for running the agents, taxis for project management, and Claude (Claude Code) as the
        coding agent; Lean/Lake builds with `lake build --wfail`.
      prompting_notes: >-
        Human input consisted of high-level task descriptions and scope decisions.
  notes: >-
    Agents were run with orchestra; project management (issues, status) was done in taxis;
    Claude was the coding agent.

fidelity:
  divergences: >-
    Proposition 2.7 is proved in pi1's form (AffOrbicurve.CanLift27: for j(E) not exceptional, the
    hemi-elliptic quotient is the k-core of E ∖ {0}, in the sense of pi1's AffOrbicurve.IsCoreOf)
    over every field of characteristic 0, and in the [EstIUT] Prop. 2.1 form (CanLift27Genuine). The Margulis commensurator theorem is
    proved only for once-punctured torus groups. The four exceptional j-values are checked against
    Sijsling's models and agree with pi1's AffOrbicurve.excJ.

review:
  status: "agent-reviewed"
  reviewers: ["Claude (Anthropic)"]
  notes: >-
    The formalization has only been reviewed by Claude; it has not been reviewed by a human.
    All results are machine-checked by the Lean kernel. `#print axioms` for every result listed
    under main_results, against a build of this repository (pi1 at 2c1e2f0, oka at 75dcdc3),
    gives only propext, Classical.choice and Quot.sound; `git grep` finds no sorry, no axiom
    declaration and no native_decide in any .lean file.

