version: "v0.4"

project:
  name: "orbicurve-cores"
  description: >-
    A Lean 4 / Mathlib formalization of Proposition 2.7 of Mochizuki's The Absolute Anabelian
    Geometry of Canonical Curves: for an elliptic curve E over a field k of characteristic 0 whose
    j-invariant is not one of the four exceptional values {0, 1728, 2¹⁴·31³/5³, 2²·73³/3⁴}, the
    hemi-elliptic quotient (E ∖ {0})/{±1} is the k-core of the once-punctured elliptic curve
    E ∖ {0} (genuine k-cores of lana-agents/pi1). The proof formalizes Takeuchi's classification of arithmetic (1;∞)-groups,
    the Margulis commensurator theorem for once-punctured torus groups (via commensurator
    superrigidity into PGL₂(ℂ) and PGL₂(ℚ_p)), the group-level statement (a (1;∞)-group admits no
    core iff it is one of Takeuchi's four groups), uniformization of E ∖ {0}, Belyi certificates
    for the four model curves, the comparison of algebraic and analytic covers (Theorem G), and
    the transfer from ℂ to arbitrary fields of characteristic 0 (spreading out and base change).
    It also contains an alternative proof over ℂ (elementary commensurator index, analytic
    rigidity, Abhyankar's lemma).
  authors:
    - "Claude (Anthropic)"
    - "LANA Project"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "The absolute anabelian geometry of canonical curves"
    authors: ["Shinichi Mochizuki"]
    id: "https://www.kurims.kyoto-u.ac.jp/~motizuki/Canonical%20Liftings.pdf"
    type: "article"
    location: "Documenta Math. Extra Volume Kato (2003), 609-640; Definition 2.1, Proposition 2.7"
    relationship: "formalizes"
    note: "Proposition 2.7 is proved over every field of characteristic 0 (every universe)."
    author_endorsement: "not-contacted"
  - title: "Arithmetic Fuchsian groups with signature (1;e)"
    authors: ["Kisao Takeuchi"]
    type: "article"
    location: "J. Math. Soc. Japan 35 (1983), 381-407"
    relationship: "formalizes"
    note: "Classification of the arithmetic (1;∞)-groups up to conjugacy (the four Takeuchi groups)."
    author_endorsement: "n/a"
  - title: "Discrete Subgroups of Semisimple Lie Groups"
    authors: ["Gregory A. Margulis"]
    type: "book"
    location: "Ergebnisse der Mathematik 17 (1991), Ch. IX (commensurator theorem)"
    relationship: "adapts"
    note: "Proved only for once-punctured torus groups, via commensurator superrigidity into PGL₂(ℂ) and PGL₂(ℚ_p)."
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/lana-agents/pi1"
    relationship: "builds-on"
    note: "Lake dependency (pinned 2c1e2f0): affine orbicurves, finite étale morphisms and genuine k-cores."
  - id: "https://github.com/lana-agents/oka"
    relationship: "builds-on"
    note: "Lake dependency (pinned 75dcdc3): uniformization of E ∖ {0}, R3, finite étale algebras over holomorphic functions on ℍ."
  - id: "https://github.com/lana-agents/iut"
    relationship: "other"
    note: >-
      Used by: iut pins this repository at 61616dc and derives CanLift 2.7 over every field of
      characteristic 0 (Iut.Anabelian.canLift27) from OrbicurveCores.U2.canLift27C.

